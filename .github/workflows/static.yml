name: Deploy resume to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download resume from Gitee
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site /tmp/resume-source
          curl -fL --retry 3 --connect-timeout 20 --max-time 120 -o /tmp/resume.zip "https://gitee.com/aoyecc/self/repository/archive/main.zip"
          unzip -q /tmp/resume.zip -d /tmp/resume-source
          index="$(find /tmp/resume-source -type f -name index.html -print -quit)"
          test -n "$index"
          cp -a "$(dirname "$index")/." site/
          test -s site/index.html
          echo "Site files:"
          find site -maxdepth 3 -type f
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
